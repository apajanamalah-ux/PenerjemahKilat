name: Build Penerjemah Live APK
on:
  workflow_dispatch:
  push:
permissions:
  contents: write
env:
  KODE_ID: 1PasHqemLFmppa5WJ04B9_RToeLU06cU1
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Ambil kode aplikasi
        run: |
          ok() { head -1 setup.sh 2>/dev/null | grep -q '^mkdir -p app/src/main/java/com/app/penerjemah'; }
          curl -sSL "https://drive.usercontent.google.com/download?id=$KODE_ID&export=download&confirm=t" -o setup.sh || true
          ok || curl -sSL "https://drive.google.com/uc?export=download&id=$KODE_ID" -o setup.sh || true
          ok || { echo "Gagal mengambil kode dari Google Drive"; head -c 400 setup.sh; exit 1; }
          bash setup.sh
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Build APK
        run: |
          gradle assembleDebug --no-daemon --stacktrace
          cp app/build/outputs/apk/debug/app-debug.apk PenerjemahLive.apk
      - uses: actions/upload-artifact@v4
        with:
          name: PenerjemahLive-APK
          path: PenerjemahLive.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Penerjemah Live v3 (build ${{ github.run_number }})
          files: PenerjemahLive.apk